<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Valentine?</title>
  <style>
    :root{
      --bg1:#ff4d6d;
      --bg2:#7b2ff7;
      --card: rgba(255,255,255,0.14);
      --card2: rgba(0,0,0,0.14);
      --text: rgba(255,255,255,0.95);
      --muted: rgba(255,255,255,0.75);
      --yes:#22c55e;
      --no:#ff3b3b;
      --shadow: rgba(0,0,0,0.25);
    }

    *{ box-sizing:border-box; }
    body{
      margin:0;
      min-height:100vh;
      display:grid;
      place-items:center;
      font-family: ui-rounded, system-ui, -apple-system, Segoe UI, Roboto, Helvetica, Arial, sans-serif;
      color:var(--text);
      overflow:hidden;
      background:
        radial-gradient(900px 500px at 20% 20%, rgba(255,255,255,0.25), transparent 60%),
        radial-gradient(900px 500px at 80% 70%, rgba(255,255,255,0.18), transparent 60%),
        linear-gradient(135deg, var(--bg1), var(--bg2));
    }

    /* Floating hearts background */
    .heart {
      position: absolute;
      font-size: 20px;
      opacity: 0.35;
      animation: floatUp linear infinite;
      user-select: none;
      pointer-events: none;
      filter: drop-shadow(0 6px 10px rgba(0,0,0,0.25));
    }
    @keyframes floatUp {
      from { transform: translateY(120vh) rotate(0deg); }
      to   { transform: translateY(-20vh) rotate(360deg); }
    }

    .wrap{
      width:min(760px, 92vw);
      padding:26px;
      border-radius:24px;
      background: linear-gradient(180deg, var(--card), rgba(255,255,255,0.08));
      border: 1px solid rgba(255,255,255,0.22);
      box-shadow: 0 25px 80px var(--shadow);
      backdrop-filter: blur(10px);
      position: relative;
      overflow:hidden;
    }

    .badge{
      display:inline-flex;
      gap:10px;
      align-items:center;
      padding:8px 12px;
      border-radius:999px;
      background: rgba(0,0,0,0.18);
      border: 1px solid rgba(255,255,255,0.22);
      color: rgba(255,255,255,0.9);
      font-weight:700;
      letter-spacing:0.2px;
      font-size:14px;
      margin-bottom:12px;
    }

    h1{
      margin: 6px 0 6px;
      font-size: clamp(28px, 4vw, 46px);
      line-height:1.05;
      letter-spacing: 0.3px;
      text-shadow: 0 10px 30px rgba(0,0,0,0.25);
    }
    p{
      margin: 0 0 18px;
      color: var(--muted);
      font-size: 16px;
      line-height: 1.55;
    }

    .arena{
      margin-top: 14px;
      position: relative;
      height: 240px;
      border-radius: 20px;
      border: 1px dashed rgba(255,255,255,0.35);
      background: linear-gradient(180deg, rgba(0,0,0,0.12), rgba(0,0,0,0.04));
      overflow: hidden;
    }

    /* "Danger circle" that No runs away from */
    .dangerRing{
      position:absolute;
      left:50%;
      top:52%;
      width: 200px;
      height: 200px;
      transform: translate(-50%, -50%);
      border-radius: 999px;
      border: 2px solid rgba(255,255,255,0.35);
      box-shadow: inset 0 0 0 10px rgba(255,255,255,0.06),
                  0 20px 50px rgba(0,0,0,0.20);
      backdrop-filter: blur(4px);
      pointer-events: none;
    }

    .hint{
      position:absolute;
      left:50%;
      top:14px;
      transform: translateX(-50%);
      font-weight:700;
      font-size: 14px;
      padding: 8px 12px;
      border-radius: 999px;
      background: rgba(0,0,0,0.16);
      border: 1px solid rgba(255,255,255,0.18);
      color: rgba(255,255,255,0.85);
      pointer-events:none;
    }

    .btn{
      border:0;
      padding: 14px 18px;
      border-radius: 999px;
      font-weight: 900;
      font-size: 16px;
      cursor: pointer;
      user-select: none;
      transition: transform 120ms ease, filter 120ms ease;
      box-shadow: 0 18px 40px rgba(0,0,0,0.25);
    }
    .btn:active{ transform: translateY(2px) scale(0.99); }

    #yesBtn{
      background: linear-gradient(180deg, #8dffb0, var(--yes));
      color:#053015;
      position:absolute;
      left: 50%;
      bottom: 18px;
      transform: translateX(-120%);
    }
    #yesBtn:hover{ filter: brightness(1.08); transform: translateX(-120%) translateY(-1px); }

    #noBtn{
      position:absolute;
      left: 50%;
      top: 60%;
      transform: translate(-50%, -50%);
      background: linear-gradient(180deg, #ff8a8a, var(--no));
      color:#3a0505;
      pointer-events: none; /* cannot be clicked */
    }

    .sparkle{
      position:absolute;
      right: 18px;
      bottom: 18px;
      padding: 10px 12px;
      border-radius: 14px;
      background: rgba(0,0,0,0.16);
      border: 1px solid rgba(255,255,255,0.18);
      font-size: 13px;
      color: rgba(255,255,255,0.85);
    }

    .hidden{ display:none !important; }

    .result{
      margin-top: 18px;
      padding: 18px;
      border-radius: 18px;
      border: 1px solid rgba(255,255,255,0.22);
      background: rgba(0,0,0,0.14);
    }
    .result h2{
      margin: 0 0 10px;
      font-size: 22px;
      letter-spacing: 0.2px;
    }
    .gif{
      width: min(460px, 100%);
      border-radius: 16px;
      border: 1px solid rgba(255,255,255,0.22);
      display:block;
      margin-top: 10px;
      box-shadow: 0 20px 60px rgba(0,0,0,0.25);
    }

    .mini{
      margin-top: 10px;
      font-size: 13px;
      color: rgba(255,255,255,0.68);
    }
  </style>
</head>
<body>

  <!-- floating hearts -->
  <script>
    (function makeHearts(){
      const hearts = ["💖","💘","💝","💗","💕","❤️"];
      const count = 18;
      for(let i=0;i<count;i++){
        const s = document.createElement("div");
        s.className = "heart";
        s.textContent = hearts[Math.floor(Math.random()*hearts.length)];
        s.style.left = Math.random()*100 + "vw";
        s.style.animationDuration = (6 + Math.random()*8) + "s";
        s.style.animationDelay = (-Math.random()*10) + "s";
        s.style.fontSize = (16 + Math.random()*22) + "px";
        document.body.appendChild(s);
      }
    })();
  </script>

  <div class="wrap">
    <div class="badge">💌 Valentine Mode</div>
    <h1>Will you be my Valentine?</h1>
    <p>Be honest. (But also… the <b>No</b> button is a little shy.)</p>

    <div class="arena" id="arena">
      <div class="hint">Try to click “No” 😈</div>
      <div class="dangerRing" id="ring"></div>

      <button id="yesBtn" class="btn" type="button">Yes 💘</button>
      <button id="noBtn" class="btn" type="button" aria-hidden="true">No 🙃</button>

      <div class="sparkle">✨ Tip: move your cursor around</div>
    </div>

    <div id="result" class="result hidden">
      <h2 id="resultText">YAY!! 💖</h2>
      <img id="resultGif" class="gif" alt="cute gif" src="" />
      <div class="mini">Refresh to replay.</div>
    </div>
  </div>

  <script>
    const arena = document.getElementById("arena");
    const ring  = document.getElementById("ring");
    const noBtn = document.getElementById("noBtn");
    const yesBtn = document.getElementById("yesBtn");

    const result = document.getElementById("result");
    const resultText = document.getElementById("resultText");
    const resultGif = document.getElementById("resultGif");

    // Swap this with any direct .gif URL you like
    const GIF_URL = "https://media.giphy.com/media/3oriO0OEd9QIDdllqo/giphy.gif";

    // "No" physics
    let noPos = { x: 0, y: 0 };      // current position in px (relative to arena)
    let noVel = { x: 0, y: 0 };      // velocity
    let target = { x: 0, y: 0 };     // desired position to flee toward
    let pointer = { x: 0, y: 0 };    // pointer pos relative to arena
    let hasPointer = false;

    function clamp(n, min, max){ return Math.max(min, Math.min(max, n)); }

    function rectCenter(rect){
      return { cx: rect.left + rect.width/2, cy: rect.top + rect.height/2 };
    }

    function initNoButton(){
      const a = arena.getBoundingClientRect();
      const b = noBtn.getBoundingClientRect();
      // start somewhere near the center
      noPos.x = (a.width - b.width)/2 + 80;
      noPos.y = (a.height - b.height)/2;
      noVel.x = 0; noVel.y = 0;
      applyNoPos();
    }

    function applyNoPos(){
      noBtn.style.left = noPos.x + "px";
      noBtn.style.top  = noPos.y + "px";
      noBtn.style.transform = "translate(0,0)";
    }

    function updatePointer(e){
      const a = arena.getBoundingClientRect();
      pointer.x = e.clientX - a.left;
      pointer.y = e.clientY - a.top;
      hasPointer = true;
    }

    function computeFleeTarget(){
      const a = arena.getBoundingClientRect();
      const r = ring.getBoundingClientRect();
      const b = noBtn.getBoundingClientRect();

      // ring center relative to arena
      const ringC = {
        x: (r.left - a.left) + r.width/2,
        y: (r.top  - a.top)  + r.height/2
      };

      // no center relative to arena
      const noC = {
        x: noPos.x + b.width/2,
        y: noPos.y + b.height/2
      };

      // If we don't have pointer yet, gently orbit away from ring center
      const px = hasPointer ? pointer.x : ringC.x + 1;
      const py = hasPointer ? pointer.y : ringC.y + 1;

      // Repel from pointer strongly, and from ring moderately
      const dxP = noC.x - px;
      const dyP = noC.y - py;
      const distP = Math.max(1, Math.hypot(dxP, dyP));

      const dxR = noC.x - ringC.x;
      const dyR = noC.y - ringC.y;
      const distR = Math.max(1, Math.hypot(dxR, dyR));

      // Strength factors
      const repelPointer = 9000 / (distP * distP);  // strong close-up repulsion
      const repelRing    = 2500 / (distR * distR);  // keeps it away from the circle

      // Combine forces
      const fx = (dxP / distP) * repelPointer + (dxR / distR) * repelRing;
      const fy = (dyP / distP) * repelPointer + (dyR / distR) * repelRing;

      // Proposed target position
      let tx = noPos.x + fx * 18;
      let ty = noPos.y + fy * 18;

      // Add randomness so it's unpredictable
      tx += (Math.random() - 0.5) * 18;
      ty += (Math.random() - 0.5) * 14;

      // Keep inside arena bounds
      const maxX = a.width  - b.width;
      const maxY = a.height - b.height;

      // Also keep it away from the bottom (so it doesn't overlap Yes too much)
      const safeBottom = maxY - 68;

      tx = clamp(tx, 8, maxX - 8);
      ty = clamp(ty, 18, safeBottom);

      target.x = tx;
      target.y = ty;
    }

    function tick(){
      // Find where it should run
      computeFleeTarget();

      // Smoothly move toward the target (spring-ish movement)
      const ax = (target.x - noPos.x) * 0.12;
      const ay = (target.y - noPos.y) * 0.12;

      noVel.x = (noVel.x + ax) * 0.78;
      noVel.y = (noVel.y + ay) * 0.78;

      noPos.x += noVel.x;
      noPos.y += noVel.y;

      applyNoPos();
      requestAnimationFrame(tick);
    }

    arena.addEventListener("pointermove", updatePointer);
    arena.addEventListener("pointerdown", updatePointer);

    yesBtn.addEventListener("click", () => {
      resultText.textContent = "YAYYY!! 💖💖 See you on Valentine’s 😌";
      resultGif.src = GIF_URL;

      arena.classList.add("hidden");
      result.classList.remove("hidden");
    });

    window.addEventListener("resize", initNoButton);

    initNoButton();
    requestAnimationFrame(tick);
  </script>
</body>
</html>

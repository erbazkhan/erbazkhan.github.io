<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Question Page</title>
  <style>
    :root {
      --bg: #0b1020;
      --card: rgba(255,255,255,0.08);
      --text: rgba(255,255,255,0.92);
      --muted: rgba(255,255,255,0.65);
      --yes: #22c55e;
      --no: #ef4444;
    }

    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100vh;
      display: grid;
      place-items: center;
      background: radial-gradient(900px 500px at 30% 20%, #1a2a6c 0%, transparent 60%),
                  radial-gradient(700px 500px at 70% 70%, #b21f1f 0%, transparent 55%),
                  var(--bg);
      color: var(--text);
      font-family: system-ui, -apple-system, Segoe UI, Roboto, Helvetica, Arial, sans-serif;
    }

    .wrap {
      width: min(720px, 92vw);
      padding: 28px;
      border-radius: 18px;
      background: var(--card);
      backdrop-filter: blur(10px);
      box-shadow: 0 20px 60px rgba(0,0,0,0.35);
      position: relative;
      overflow: hidden;
    }

    h1 {
      margin: 0 0 8px;
      font-size: clamp(22px, 3.2vw, 34px);
      letter-spacing: 0.2px;
    }

    p {
      margin: 0 0 18px;
      color: var(--muted);
      line-height: 1.5;
    }

    form {
      display: flex;
      gap: 10px;
      flex-wrap: wrap;
      align-items: center;
      margin: 12px 0 18px;
    }

    input[type="text"] {
      flex: 1 1 340px;
      padding: 12px 14px;
      border-radius: 12px;
      border: 1px solid rgba(255,255,255,0.14);
      background: rgba(0,0,0,0.18);
      color: var(--text);
      outline: none;
      font-size: 16px;
    }
    input[type="text"]::placeholder { color: rgba(255,255,255,0.45); }

    button, .btn {
      border: 0;
      padding: 12px 16px;
      border-radius: 12px;
      font-weight: 700;
      cursor: pointer;
      user-select: none;
      font-size: 16px;
      transition: transform 120ms ease, filter 120ms ease;
    }

    .btn-ask {
      background: rgba(255,255,255,0.14);
      color: var(--text);
    }
    .btn-ask:hover { filter: brightness(1.12); }

    .choice-area {
      position: relative;
      height: 110px; /* gives space for the No button to run around */
      margin-top: 6px;
    }

    #yesBtn {
      background: var(--yes);
      color: #06210f;
      box-shadow: 0 10px 30px rgba(34,197,94,0.25);
    }
    #yesBtn:hover { transform: translateY(-1px); }
    #yesBtn:active { transform: translateY(1px) scale(0.99); }

    #noBtn {
      position: absolute;
      left: 160px;
      top: 0px;
      background: var(--no);
      color: #2a0404;
      box-shadow: 0 10px 30px rgba(239,68,68,0.2);
      /* Not clickable */
      pointer-events: none;
    }

    .hidden { display: none !important; }

    .result {
      margin-top: 18px;
      padding: 16px;
      border-radius: 14px;
      border: 1px solid rgba(255,255,255,0.14);
      background: rgba(0,0,0,0.18);
    }

    .gif {
      width: min(420px, 100%);
      border-radius: 14px;
      display: block;
      margin-top: 12px;
      border: 1px solid rgba(255,255,255,0.14);
    }

    .small {
      margin-top: 10px;
      font-size: 14px;
      color: rgba(255,255,255,0.55);
    }
  </style>
</head>
<body>
  <div class="wrap">
    <h1>Ask me a question 👀</h1>
    <p>Type your question, then choose <b>Yes</b> or <b>No</b>.</p>

    <form id="qForm">
      <input id="qInput" type="text" placeholder="e.g., Will you go on a date with me?" maxlength="120" />
      <button class="btn-ask" type="submit">Set Question</button>
    </form>

    <div class="choice-area" id="choiceArea" aria-label="choices">
      <button id="yesBtn" class="btn" type="button">Yes</button>
      <button id="noBtn" class="btn" type="button" aria-hidden="true">No</button>
    </div>

    <div id="result" class="result hidden">
      <div id="resultText" style="font-size:18px; font-weight:800;"></div>
      <img
        id="resultGif"
        class="gif"
        alt="celebration gif"
        src=""
      />
      <div class="small">Refresh the page to do it again.</div>
    </div>
  </div>

  <script>
    const qForm = document.getElementById("qForm");
    const qInput = document.getElementById("qInput");
    const yesBtn = document.getElementById("yesBtn");
    const noBtn  = document.getElementById("noBtn");
    const choiceArea = document.getElementById("choiceArea");

    const result = document.getElementById("result");
    const resultText = document.getElementById("resultText");
    const resultGif = document.getElementById("resultGif");

    // Pick a GIF URL you like (you can use any direct .gif URL)
    const GIF_URL = "https://media.giphy.com/media/111ebonMs90YLu/giphy.gif";

    // Set default question
    let question = "Do you like this idea?";

    function clamp(n, min, max) { return Math.max(min, Math.min(max, n)); }

    function moveNoButtonAway(pointerX, pointerY) {
      // Get bounds for the area where the No button can run around
      const areaRect = choiceArea.getBoundingClientRect();

      // No button size
      const noRect = noBtn.getBoundingClientRect();
      const maxX = areaRect.width - noRect.width;
      const maxY = areaRect.height - noRect.height;

      // Cursor position relative to the choice area
      const relX = pointerX - areaRect.left;
      const relY = pointerY - areaRect.top;

      // Current "No" button position
      const currentLeft = parseFloat(noBtn.style.left || "160");
      const currentTop  = parseFloat(noBtn.style.top || "0");

      // Direction from cursor to button (so we move away from cursor)
      const dx = currentLeft + noRect.width/2 - relX;
      const dy = currentTop  + noRect.height/2 - relY;

      // If cursor is exactly centered, pick a random direction
      const len = Math.hypot(dx, dy) || 1;
      const ux = dx / len;
      const uy = dy / len;

      // Move distance
      const step = 140; // bigger = more dramatic escape

      let newLeft = currentLeft + ux * step;
      let newTop  = currentTop  + uy * step;

      // Add a little randomness so it doesn't look "too perfect"
      newLeft += (Math.random() - 0.5) * 60;
      newTop  += (Math.random() - 0.5) * 40;

      // Keep it inside the choice area
      newLeft = clamp(newLeft, 0, maxX);
      newTop  = clamp(newTop, 0, maxY);

      noBtn.style.left = `${newLeft}px`;
      noBtn.style.top  = `${newTop}px`;
    }

    // Run away when user tries to approach the "No" button
    // (we trigger on pointer movement within the choice area)
    choiceArea.addEventListener("pointermove", (e) => {
      const noRect = noBtn.getBoundingClientRect();
      const dist = Math.hypot(
        (e.clientX - (noRect.left + noRect.width/2)),
        (e.clientY - (noRect.top  + noRect.height/2))
      );

      // If cursor gets close, it runs
      if (dist < 120) moveNoButtonAway(e.clientX, e.clientY);
    });

    // Also run away if user taps near it on mobile
    choiceArea.addEventListener("pointerdown", (e) => {
      moveNoButtonAway(e.clientX, e.clientY);
    });

    // Allow user to set question text
    qForm.addEventListener("submit", (e) => {
      e.preventDefault();
      const val = qInput.value.trim();
      if (val) question = val;
      qInput.blur();
    });

    // YES is clickable; show GIF + text and hide buttons
    yesBtn.addEventListener("click", () => {
      resultText.textContent = `You said YES 😌 — "${question}"`;
      resultGif.src = GIF_URL;

      // Hide choice area, show result
      choiceArea.classList.add("hidden");
      result.classList.remove("hidden");
    });
  </script>
</body>
</html>

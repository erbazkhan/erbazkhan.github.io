<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Valentine?</title>
  <style>
    :root{
      --bg1:#ff4d6d;
      --bg2:#7b2ff7;
      --card: rgba(255,255,255,0.14);
      --text: rgba(255,255,255,0.95);
      --muted: rgba(255,255,255,0.75);
      --yes:#22c55e;
      --no:#ff3b3b;
      --shadow: rgba(0,0,0,0.25);
    }

    *{ box-sizing:border-box; }

    body{
      margin:0;
      min-height:100vh;
      display:grid;
      place-items:center;
      font-family: ui-rounded, system-ui, -apple-system, Segoe UI, Roboto, Helvetica, Arial, sans-serif;
      color:var(--text);
      overflow:hidden;
      background:
        radial-gradient(900px 500px at 20% 20%, rgba(255,255,255,0.25), transparent 60%),
        radial-gradient(900px 500px at 80% 70%, rgba(255,255,255,0.18), transparent 60%),
        linear-gradient(135deg, var(--bg1), var(--bg2));
    }

    /* floating hearts */
    .heart {
      position: absolute;
      font-size: 20px;
      opacity: 0.35;
      animation: floatUp linear infinite;
      user-select: none;
      pointer-events: none;
    }

    @keyframes floatUp {
      from { transform: translateY(120vh) rotate(0deg); }
      to   { transform: translateY(-20vh) rotate(360deg); }
    }

    .wrap{
      width:min(760px, 92vw);
      padding:26px;
      border-radius:24px;
      background: var(--card);
      border: 1px solid rgba(255,255,255,0.22);
      box-shadow: 0 25px 80px var(--shadow);
      backdrop-filter: blur(10px);
    }

    h1{
      margin: 6px 0;
      font-size: clamp(28px, 4vw, 46px);
    }

    p{
      margin: 0 0 18px;
      color: var(--muted);
    }

    .arena{
      margin-top: 14px;
      position: relative;
      height: 220px;
      border-radius: 20px;
      border: 1px dashed rgba(255,255,255,0.35);
      background: rgba(0,0,0,0.08);
      overflow: hidden;
    }

    .btn{
      border:0;
      padding: 14px 18px;
      border-radius: 999px;
      font-weight: 900;
      font-size: 16px;
      cursor: pointer;
      user-select: none;
    }

    #yesBtn{
      background: #22c55e;
      color:#053015;
      position:absolute;
      left: 40%;
      bottom: 18px;
    }

    #noBtn{
      position:absolute;
      left: 50%;
      top: 50%;
      background: #ff3b3b;
      color:#3a0505;

      /* THE IMPORTANT PART — cannot be clicked */
      pointer-events: none;
    }

    .hidden{ display:none !important; }

    .result{
      margin-top: 18px;
      padding: 18px;
      border-radius: 18px;
      background: rgba(0,0,0,0.14);
    }

    .gif{
      width: min(420px, 100%);
      border-radius: 16px;
      margin-top: 10px;
    }

  </style>
</head>

<body>

<script>
// create hearts
(function(){
  const hearts = ["💖","💘","💝","💗","💕","❤️"];
  for(let i=0;i<18;i++){
    const h = document.createElement("div");
    h.className = "heart";
    h.textContent = hearts[Math.floor(Math.random()*hearts.length)];
    h.style.left = Math.random()*100 + "vw";
    h.style.animationDuration = (6 + Math.random()*8) + "s";
    document.body.appendChild(h);
  }
})();
</script>

<div class="wrap">
  <h1>Will you be my Valentine?</h1>
  <p>The No button is a little shy…</p>

  <div class="arena" id="arena">
    <button id="yesBtn" class="btn">Yes 💘</button>
    <button id="noBtn" class="btn">No 🙃</button>
  </div>

  <div id="result" class="result hidden">
    <h2>YAYYY!! 💖</h2>
    <img id="gif" class="gif"
         src="https://media.giphy.com/media/3oriO0OEd9QIDdllqo/giphy.gif" />
  </div>
</div>

<script>
const arena = document.getElementById("arena");
const noBtn = document.getElementById("noBtn");
const yesBtn = document.getElementById("yesBtn");
const result = document.getElementById("result");

let pos = {x: 200, y: 80};
let vel = {x: 0, y: 0};

function clamp(n,min,max){return Math.max(min,Math.min(max,n));}

function moveAway(pointerX, pointerY){
  const rect = arena.getBoundingClientRect();

  const dx = pos.x - pointerX;
  const dy = pos.y - pointerY;

  const dist = Math.hypot(dx,dy) || 1;

  const force = 6000 / (dist*dist);

  vel.x += (dx/dist) * force;
  vel.y += (dy/dist) * force;
}

arena.addEventListener("pointermove", e=>{
  moveAway(e.clientX - arena.getBoundingClientRect().left,
           e.clientY - arena.getBoundingClientRect().top);
});

function tick(){
  vel.x *= 0.8;
  vel.y *= 0.8;

  pos.x += vel.x;
  pos.y += vel.y;

  const maxX = arena.clientWidth - 80;
  const maxY = arena.clientHeight - 40;

  pos.x = clamp(pos.x, 10, maxX);
  pos.y = clamp(pos.y, 10, maxY);

  noBtn.style.left = pos.x + "px";
  noBtn.style.top  = pos.y + "px";

  requestAnimationFrame(tick);
}

yesBtn.addEventListener("click", ()=>{
  arena.classList.add("hidden");
  result.classList.remove("hidden");
});

tick();
</script>

</body>
</html>

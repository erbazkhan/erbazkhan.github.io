<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Will you be my Valentine?</title>
  <style>
    :root{
      --bg1:#ff4d6d;
      --bg2:#ffb3c1;
      --card: rgba(255,255,255,0.20);
      --card2: rgba(255,255,255,0.10);
      --text: rgba(255,255,255,0.96);
      --muted: rgba(255,255,255,0.80);
      --yes:#34d399;
      --yesText:#06351f;
      --no:#fb7185;
      --noText:#3b0a12;
      --shadow: rgba(0,0,0,0.25);
    }

    *{ box-sizing:border-box; }
    body{
      margin:0;
      min-height:100vh;
      display:grid;
      place-items:center;
      font-family: system-ui,-apple-system,Segoe UI,Roboto,Helvetica,Arial,sans-serif;
      color:var(--text);
      background:
        radial-gradient(900px 500px at 20% 20%, rgba(255,255,255,0.35) 0%, transparent 60%),
        radial-gradient(700px 500px at 80% 70%, rgba(255,255,255,0.25) 0%, transparent 55%),
        linear-gradient(135deg, var(--bg1), var(--bg2));
      overflow:hidden;
    }

    /* floating hearts */
    .heart{
      position: fixed;
      width: 14px; height: 14px;
      transform: rotate(45deg);
      opacity: 0.25;
      pointer-events:none;
      animation: floatUp linear infinite;
      background: rgba(255,255,255,0.75);
      border-radius: 3px;
    }
    .heart:before, .heart:after{
      content:"";
      position:absolute;
      width: 14px; height: 14px;
      background: rgba(255,255,255,0.75);
      border-radius: 50%;
      top:-7px; left:0;
    }
    .heart:after{
      left:-7px; top:0;
    }
    @keyframes floatUp{
      from { transform: translateY(110vh) rotate(45deg); }
      to   { transform: translateY(-20vh) rotate(45deg); }
    }

    .wrap{
      width:min(760px, 92vw);
      padding: 26px 26px 22px;
      border-radius: 22px;
      background: var(--card);
      backdrop-filter: blur(12px);
      box-shadow: 0 20px 70px var(--shadow);
      border: 1px solid rgba(255,255,255,0.22);
      position: relative;
      overflow:hidden;
    }

    .topRow{
      display:flex;
      gap:14px;
      align-items:flex-start;
      justify-content:space-between;
      flex-wrap:wrap;
    }

    h1{
      margin:0;
      font-size: clamp(26px, 3.6vw, 40px);
      letter-spacing: 0.2px;
      text-shadow: 0 10px 30px rgba(0,0,0,0.25);
    }

    .subtitle{
      margin: 6px 0 0;
      color: var(--muted);
      font-size: 15px;
      line-height: 1.4;
    }

    .badge{
      display:inline-flex;
      align-items:center;
      gap:8px;
      padding: 10px 12px;
      border-radius: 999px;
      border: 1px solid rgba(255,255,255,0.22);
      background: rgba(0,0,0,0.12);
      font-weight: 700;
      font-size: 13px;
      white-space: nowrap;
    }

    .badge .dot{
      width: 9px;
      height: 9px;
      border-radius: 999px;
      background: rgba(255,255,255,0.95);
      box-shadow: 0 0 18px rgba(255,255,255,0.65);
    }

    .stage{
      margin-top: 18px;
      padding: 18px;
      border-radius: 18px;
      background: var(--card2);
      border: 1px solid rgba(255,255,255,0.18);
      position: relative;
    }

    .choiceArea{
      position: relative;
      height: 260px;
      margin-top: 12px;
      border-radius: 18px;
      border: 2px dashed rgba(255,255,255,0.35);
      background: rgba(0,0,0,0.10);
      overflow: hidden;
    }

    /* the "circle" (a soft glow region around No) */
    .shyCircle{
      position:absolute;
      width: 170px;
      height: 170px;
      border-radius: 999px;
      left: 55%;
      top: 40%;
      transform: translate(-50%, -50%);
      background: radial-gradient(circle at center, rgba(255,255,255,0.22), rgba(255,255,255,0.05) 60%, transparent 70%);
      border: 2px solid rgba(255,255,255,0.25);
      box-shadow: 0 0 30px rgba(255,255,255,0.16);
      pointer-events:none;
    }

    .btn{
      border: 0;
      border-radius: 14px;
      padding: 12px 18px;
      font-size: 18px;
      font-weight: 900;
      cursor: pointer;
      user-select: none;
      transition: transform 120ms ease, filter 120ms ease;
      box-shadow: 0 12px 32px rgba(0,0,0,0.20);
    }

    #yesBtn{
      background: var(--yes);
      color: var(--yesText);
      position:absolute;
      left: 18%;
      top: 48%;
      transform: translate(-50%, -50%);
    }
    #yesBtn:hover{ filter: brightness(1.08); transform: translate(-50%, -52%); }
    #yesBtn:active{ transform: translate(-50%, -48%) scale(0.99); }

    #noBtn{
      position:absolute;
      left: 70%;
      top: 48%;
      transform: translate(-50%, -50%);
      background: var(--no);
      color: var(--noText);
      pointer-events: none; /* cannot be clicked */
    }

    .hint{
      position:absolute;
      right: 14px;
      top: 14px;
      max-width: 240px;
      padding: 10px 12px;
      border-radius: 14px;
      border: 1px solid rgba(255,255,255,0.22);
      background: rgba(0,0,0,0.14);
      font-size: 14px;
      color: rgba(255,255,255,0.90);
      opacity: 0;
      transform: translateY(-6px);
      transition: opacity 150ms ease, transform 150ms ease;
      pointer-events:none;
    }
    .hint.show{
      opacity: 1;
      transform: translateY(0);
    }
    .hint b{ font-weight: 900; }

    .result{
      margin-top: 16px;
      padding: 16px;
      border-radius: 16px;
      border: 1px solid rgba(255,255,255,0.18);
      background: rgba(0,0,0,0.14);
    }
    .resultTitle{
      font-size: 20px;
      font-weight: 950;
      letter-spacing: 0.2px;
    }
    .resultText{
      margin-top: 8px;
      color: rgba(255,255,255,0.88);
      line-height: 1.5;
      font-size: 16px;
    }
    .gif{
      width: min(420px, 100%);
      border-radius: 16px;
      display:block;
      margin-top: 12px;
      border: 1px solid rgba(255,255,255,0.20);
    }

    .footerNote{
      margin-top: 12px;
      font-size: 13px;
      color: rgba(255,255,255,0.70);
    }

    .hidden{ display:none !important; }

    @media (max-width: 520px){
      .choiceArea{ height: 280px; }
      #yesBtn{ left: 30%; }
      #noBtn{ left: 70%; }
      .hint{ right: 10px; left: 10px; max-width: none; }
    }
  </style>
</head>

<body>
  <!-- floating hearts (purely for fun) -->
  <div class="heart" style="left:8%;  animation-duration:12s; animation-delay:-2s;"></div>
  <div class="heart" style="left:18%; animation-duration:15s; animation-delay:-8s;"></div>
  <div class="heart" style="left:34%; animation-duration:11s; animation-delay:-5s;"></div>
  <div class="heart" style="left:52%; animation-duration:16s; animation-delay:-10s;"></div>
  <div class="heart" style="left:68%; animation-duration:13s; animation-delay:-6s;"></div>
  <div class="heart" style="left:82%; animation-duration:14s; animation-delay:-9s;"></div>
  <div class="heart" style="left:92%; animation-duration:17s; animation-delay:-4s;"></div>

  <div class="wrap">
    <div class="topRow">
      <div>
        <h1>Will you be my Valentine? 💘</h1>
        <div class="subtitle">There are two choices. One of them is… a little shy.</div>
      </div>
      <div class="badge" title="Totally scientific measurement">
        <span class="dot"></span>
        No-button shyness: <span id="shyMeter">high</span>
      </div>
    </div>

    <div class="stage">
      <div style="font-weight:800; font-size:15px; color: rgba(255,255,255,0.9);">
        Try to click “No” if you can 😏
      </div>

      <div class="choiceArea" id="choiceArea">
        <div class="shyCircle" id="shyCircle"></div>
        <div class="hint" id="hint">No seems shy! 🫣</div>

        <button id="yesBtn" class="btn" type="button">Yes</button>
        <button id="noBtn"  class="btn" type="button" aria-hidden="true">No</button>
      </div>

      <div id="result" class="result hidden">
        <div class="resultTitle">Yessss!! 🎉💖</div>
        <div class="resultText" id="resultText">
          You just made my day. Happy Valentine’s! 💕
        </div>
        <img
          id="resultGif"
          class="gif"
          alt="happy gif"
          src=""
        />
        <div class="footerNote">Refresh to play again.</div>
      </div>
    </div>
  </div>

  <script>
    const choiceArea = document.getElementById("choiceArea");
    const shyCircle = document.getElementById("shyCircle");
    const hint = document.getElementById("hint");
    const shyMeter = document.getElementById("shyMeter");

    const yesBtn = document.getElementById("yesBtn");
    const noBtn = document.getElementById("noBtn");

    const result = document.getElementById("result");
    const resultGif = document.getElementById("resultGif");

    // Pick any direct .gif URL you like:
    const GIF_URL = "https://media.giphy.com/media/111ebonMs90YLu/giphy.gif";

    // For "No seems shy!" message timing
    let hintTimeout = null;

    // Optional: track how many escapes happened
    let escapes = 0;

    function clamp(n, min, max) { return Math.max(min, Math.min(max, n)); }

    function showHint() {
      hint.classList.add("show");
      if (hintTimeout) clearTimeout(hintTimeout);
      hintTimeout = setTimeout(() => hint.classList.remove("show"), 650);
    }

    function updateMeter() {
      // playful meter based on escapes
      if (escapes < 3) shyMeter.textContent = "medium";
      else if (escapes < 7) shyMeter.textContent = "high";
      else shyMeter.textContent = "EXTREME";
    }

    function placeNoAt(x, y) {
      const areaRect = choiceArea.getBoundingClientRect();
      const noRect = noBtn.getBoundingClientRect();

      // Convert target x,y in viewport coords → coords inside choiceArea
      const relX = x - areaRect.left;
      const relY = y - areaRect.top;

      // Constrain within bounds
      const maxX = areaRect.width - noRect.width;
      const maxY = areaRect.height - noRect.height;

      const left = clamp(relX - noRect.width / 2, 0, maxX);
      const top  = clamp(relY - noRect.height / 2, 0, maxY);

      noBtn.style.left = `${left}px`;
      noBtn.style.top  = `${top}px`;
    }

    // We want No to keep running away from the "circle" AND the cursor.
    function runNoAway(pointerX, pointerY) {
      const areaRect = choiceArea.getBoundingClientRect();
      const circleRect = shyCircle.getBoundingClientRect();
      const noRect = noBtn.getBoundingClientRect();

      // Centers
      const cx = circleRect.left + circleRect.width / 2;
      const cy = circleRect.top + circleRect.height / 2;
      const nx = noRect.left + noRect.width / 2;
      const ny = noRect.top + noRect.height / 2;

      // Direction away from cursor
      let dx1 = nx - pointerX;
      let dy1 = ny - pointerY;
      const len1 = Math.hypot(dx1, dy1) || 1;
      dx1 /= len1; dy1 /= len1;

      // Direction away from circle center (so it "runs away from the circle")
      let dx2 = nx - cx;
      let dy2 = ny - cy;
      const len2 = Math.hypot(dx2, dy2) || 1;
      dx2 /= len2; dy2 /= len2;

      // Combine both directions (weighted)
      let ux = dx1 * 0.7 + dx2 * 0.9;
      let uy = dy1 * 0.7 + dy2 * 0.9;
      const len = Math.hypot(ux, uy) || 1;
      ux /= len; uy /= len;

      // Step size and randomness for fun
      const step = 170;
      const jitterX = (Math.random() - 0.5) * 90;
      const jitterY = (Math.random() - 0.5) * 70;

      const targetX = nx + ux * step + jitterX;
      const targetY = ny + uy * step + jitterY;

      // Place within the area
      const relTargetX = clamp(targetX, areaRect.left, areaRect.right);
      const relTargetY = clamp(targetY, areaRect.top, areaRect.bottom);

      placeNoAt(relTargetX, relTargetY);

      escapes++;
      updateMeter();
      showHint();
    }

    // "Catch radius" around No (if cursor gets near, it flees)
    function distanceToNo(pointerX, pointerY) {
      const r = noBtn.getBoundingClientRect();
      const nx = r.left + r.width / 2;
      const ny = r.top + r.height / 2;
      return Math.hypot(pointerX - nx, pointerY - ny);
    }

    // On pointer movement inside area, make No flee when user gets close
    choiceArea.addEventListener("pointermove", (e) => {
      const d = distanceToNo(e.clientX, e.clientY);
      if (d < 140) runNoAway(e.clientX, e.clientY);
    });

    // On tap/click inside area (mobile), make it flee too
    choiceArea.addEventListener("pointerdown", (e) => {
      const d = distanceToNo(e.clientX, e.clientY);
      if (d < 220) runNoAway(e.clientX, e.clientY);
    });

    // Initial placement (in case layout shifts)
    window.addEventListener("load", () => {
      // Place No near the circle at first
      const c = shyCircle.getBoundingClientRect();
      placeNoAt(c.left + c.width/2, c.top + c.height/2);
    });

    // YES click: show GIF and hide the area
    yesBtn.addEventListener("click", () => {
      resultGif.src = GIF_URL;
      choiceArea.classList.add("hidden");
      result.classList.remove("hidden");
    });
  </script>
</body>
</html>
